<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Admin Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>

    <style>
        /* Shopping-themed gradient background */

            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .glass-effect {

<script>
// Database simulation using in-memory storage
class Database {
    constructor() {
        this.users = [];
        this.products = [];
        this.orders = [];
        this.currentUser = null;
        this.sessionToken = null;
    }
    
    // User authentication
    register(username, password) {
        if (this.users.find(u => u.username === username)) {
            throw new Error('Username already exists');
        }
        
        const user = {
            id: this.users.length + 1,
            username,
            password,
            isAdmin: username.toLowerCase().includes('admin') || username === 'Admin123!@#',
            createdAt: new Date().toISOString()
        };
        
        this.users.push(user);
        return user;
    }
    
    login(username, password) {
        const user = this.users.find(u => u.username === username && u.password === password);
        if (!user) {
            throw new Error('Invalid credentials');
        }
        
        this.currentUser = user;
        this.sessionToken = Math.random().toString(36).substr(2, 9);
        return { user, token: this.sessionToken };
    }
    
    logout() {
        this.currentUser = null;
        this.sessionToken = null;
    }
    
    // Product management
    addProduct(product) {
        const newProduct = {
            id: this.products.length + 1,
            ...product,
            createdAt: new Date().toISOString()
        };
        this.products.push(newProduct);
        return newProduct;
    }
    
    updateProduct(id, updates) {
        const index = this.products.findIndex(p => p.id === id);
        if (index !== -1) {
            this.products[index] = { ...this.products[index], ...updates };
            return this.products[index];
        }
        throw new Error('Product not found');
    }
    
    deleteProduct(id) {
        const index = this.products.findIndex(p => p.id === id);
        if (index !== -1) {
            this.products.splice(index, 1);
            return true;
        }
        return false;
    }
    
    getActiveProducts() {
        return this.products.filter(p => p.status === 'active');
    }
    
    // Order management
    createOrder(items, total) {
        const order = {
            id: this.orders.length + 1,
            userId: this.currentUser.id,
            items,
            total,
            status: 'pending',
            createdAt: new Date().toISOString()
        };
        this.orders.push(order);
        return order;
    }
    
    updateOrderStatus(id, status) {
        const order = this.orders.find(o => o.id === id);
        if (order) {
            order.status = status;
            return order;
        }
        throw new Error('Order not found');
    }
}

const db = new Database();

// Ripple.js framework simulation
class RippleComponent {
    constructor() {
        this.state = {};
        this.props = {};
    }
    
    setState(newState) {
        this.state = { ...this.state, ...newState };
        this.render();
    }
    
    render() {
        // Override in components
    }
}

// Router simulation
class Router {
    constructor() {
        this.routes = {};
        this.currentRoute = '/';
    }
    
    route(path, component) {
        this.routes[path] = component;
    }
    
    navigate(path) {
        this.currentRoute = path;
        this.renderCurrentRoute();
    }
    
    renderCurrentRoute() {
        const component = this.routes[this.currentRoute];
        if (component) {
            document.getElementById('app').innerHTML = component();
        }
    }
}

const router = new Router();

// Utility functions
function validatePassword(password) {
    const requirements = [
        { test: password.length >= 16, message: "Must be at least 16 characters" },
        { test: /[A-Z]/.test(password), message: "Must contain uppercase letter" },
        { test: /[a-z]/.test(password), message: "Must contain lowercase letter" },
        { test: /\d/.test(password), message: "Must contain at least 2 numbers" },
        { test: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password), message: "Must contain special character" },
        { test: (password.match(/\d/g) || []).length >= 2, message: "Must contain at least 2 numbers" },
        { test: !/(.)\1{2,}/.test(password), message: "No more than 2 consecutive identical characters" },
        { test: !/123|abc|qwe/i.test(password), message: "Cannot contain common sequences" }
    ];
    
    return requirements.filter(req => !req.test).map(req => req.message);
}

function validateUsername(username) {
    const requirements = [
        { test: username.length >= 8, message: "Must be at least 8 characters" },
        { test: /^[a-zA-Z]/.test(username), message: "Must start with a letter" },
        { test: /\d/.test(username), message: "Must contain at least one number" },
        { test: /[A-Z]/.test(username), message: "Must contain at least one uppercase letter" },
        { test: /[!@#$%^&*()_+\-=]/.test(username), message: "Must contain at least one special character (!@#$%^&*()_+-=)" }
    ];
    
    return requirements.filter(req => !req.test).map(req => req.message);
}

// Event handlers and utility functions
function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('loginUsername').value;
    const password = document.getElementById('loginPassword').value;
    
    const usernameErrors = validateUsername(username);
    const passwordErrors = validatePassword(password);
    
    document.getElementById('usernameErrors').innerHTML = usernameErrors.join('<br>');
    document.getElementById('passwordErrors').innerHTML = passwordErrors.join('<br>');
    
    if (usernameErrors.length > 0 || passwordErrors.length > 0) {
        return;
    }
    
    try {
        const result = db.login(username, password);
        if (result.user.isAdmin) {
            router.navigate('/admin');
        } else {
            router.navigate('/user');
        }
    } catch (error) {
        document.getElementById('loginError').textContent = error.message;
    }
}

function handleSignup(e) {
    e.preventDefault();
    const username = document.getElementById('signupUsername').value;
    const password = document.getElementById('signupPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    const usernameErrors = validateUsername(username);
    const passwordErrors = validatePassword(password);
    
    document.getElementById('signupUsernameErrors').innerHTML = usernameErrors.join('<br>');
    document.getElementById('signupPasswordErrors').innerHTML = passwordErrors.join('<br>');
    
    if (password !== confirmPassword) {
        document.getElementById('confirmPasswordError').textContent = "Passwords don't match";
        return;
    } else {
        document.getElementById('confirmPasswordError').textContent = "";
    }
    
    if (usernameErrors.length > 0 || passwordErrors.length > 0) {
        return;
    }
    
    try {
        db.register(username, password);
        alert('Account created successfully! Please login.');
        router.navigate('/');
    } catch (error) {
        document.getElementById('signupError').textContent = error.message;
    }
}

function handleProductForm(e) {
    e.preventDefault();
    const name = document.getElementById('productName').value;
    const price = parseFloat(document.getElementById('productPrice').value);
    const image = document.getElementById('productImage').value;
    const status = document.getElementById('productStatus').value;
    const description = document.getElementById('productDescription').value;
    
    db.addProduct({ name, price, image, status, description });
    router.navigate('/admin'); // Refresh
}

function logout() {
    db.logout();
    router.navigate('/');
}

function showTab(tab) {
    // Update tab buttons
    document.getElementById('productsTab').classList.remove('bg-green-600', 'text-white');
    document.getElementById('productsTab').classList.add('text-green-200', 'hover:text-white');
    document.getElementById('ordersTab').classList.remove('bg-green-600', 'text-white');
    document.getElementById('ordersTab').classList.add('text-green-200', 'hover:text-white');
    
    document.getElementById(tab + 'Tab').classList.remove('text-green-200', 'hover:text-white');
    document.getElementById(tab + 'Tab').classList.add('bg-green-600', 'text-white');
    
    // Show/hide content
    document.getElementById('productsContent').style.display = tab === 'products' ? 'block' : 'none';
    document.getElementById('ordersContent').style.display = tab === 'orders' ? 'block' : 'none';
}

function toggleProductStatus(id) {
    const product = db.products.find(p => p.id === id);
    if (product) {
        product.status = product.status === 'active' ? 'inactive' : 'active';
        router.navigate('/admin'); // Refresh
    }
}

function deleteProduct(id) {
    db.deleteProduct(id);
    router.navigate('/admin'); // Refresh
}

function updateOrderStatus(orderId, status) {
    db.updateOrderStatus(orderId, status);
    router.navigate('/admin'); // Refresh
}

function addToCart(productId) {
    const product = db.products.find(p => p.id === productId);
    if (!product) return;
    
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const existingItem = cart.find(item => item.id === productId);
    
    if (existingItem) {
        existingItem.quantity += 1;
    } else {
        cart.push({
            id: product.id,
            name: product.name,
            price: product.price,
            quantity: 1
        });
    }
    
    localStorage.setItem('cart', JSON.stringify(cart));
    router.navigate('/user'); // Refresh to update cart count
}

function updateCartQuantity(productId, newQuantity) {
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    
    if (newQuantity <= 0) {
        cart = cart.filter(item => item.id !== productId);
    } else {
        const item = cart.find(item => item.id === productId);
        if (item) {
            item.quantity = newQuantity;
        }
    }
    
    localStorage.setItem('cart', JSON.stringify(cart));
    router.navigate('/user'); // Refresh
}

function showCart() {
    const modal = document.getElementById('cartModal');
    if (modal) {
        modal.style.display = 'flex';
    }
}

function hideCart() {
    const modal = document.getElementById('cartModal');
    if (modal) {
        modal.style.display = 'none';
    }
}

function checkout() {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    if (cart.length === 0) return;
    
    const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    
    try {
        const order = db.createOrder(cart, total);
        localStorage.removeItem('cart'); // Clear cart
        alert(`Order #${order.id} placed successfully! Total: ${total.toFixed(2)}\nYour order is pending admin approval.`);
        router.navigate('/user'); // Refresh
    } catch (error) {
        alert('Error placing order: ' + error.message);
    }
}

// Route definitions
router.route('/', LoginForm);

// Event delegation for dynamic content
document.addEventListener('click', function(e) {
    // Handle form submissions and other dynamic events
    if (e.target.closest('#loginForm')) {
        e.preventDefault();
        if (e.target.type === 'submit') {
            handleLogin(e);
        }
    }
    
    if (e.target.closest('#signupForm')) {
        e.preventDefault();
        if (e.target.type === 'submit') {
            handleSignup(e);
        }
    }
    
    if (e.target.closest('#productForm')) {
        e.preventDefault();
        if (e.target.type === 'submit') {
            handleProductForm(e);
        }
    }
    
    // Close cart modal when clicking outside
    if (e.target.id === 'cartModal') {
        hideCart();
    }
});

// Form submission event listeners
document.addEventListener('submit', function(e) {
    if (e.target.id === 'loginForm') {
        handleLogin(e);
    } else if (e.target.id === 'signupForm') {
        handleSignup(e);
    } else if (e.target.id === 'productForm') {
        handleProductForm(e);
    }
});

// Real-time validation for signup form
document.addEventListener('input', function(e) {
    if (e.target.id === 'signupUsername') {
        const errors = validateUsername(e.target.value);
        document.getElementById('signupUsernameErrors').innerHTML = errors.join('<br>');
    }
    
    if (e.target.id === 'signupPassword') {
        const errors = validatePassword(e.target.value);
        document.getElementById('signupPasswordErrors').innerHTML = errors.join('<br>');
    }
    
    if (e.target.id === 'confirmPassword') {
        const password = document.getElementById('signupPassword').value;
        const confirmPassword = e.target.value;
        const errorElement = document.getElementById('confirmPasswordError');
        
        if (password !== confirmPassword && confirmPassword.length > 0) {
            errorElement.textContent = "Passwords don't match - they must be identical!";
        } else {
            errorElement.textContent = "";
        }
    }
    
    // Real-time validation for login
    if (e.target.id === 'loginUsername') {
        const errors = validateUsername(e.target.value);
        document.getElementById('usernameErrors').innerHTML = errors.join('<br>');
    }
    
    if (e.target.id === 'loginPassword') {
        const errors = validatePassword(e.target.value);
        document.getElementById('passwordErrors').innerHTML = errors.join('<br>');
    }
});
